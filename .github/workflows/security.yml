name: security

# Pipeline DevSecOps (Ex. 12). O job security-gate consolida os resultados e
# bloqueia o merge conforme o critério definido/justificado em docs/12.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # SCA semanal (segunda 06:00 UTC): CVEs surgem sem mudança de código

defaults:
  run:
    working-directory: consultas-api

env:
  # Segredos de TESTE apenas (nunca reais). O gate não depende de segredo real.
  ENV: dev
  JWT_SECRET_KEY: ci-test-secret-nao-usar-em-producao
  DATABASE_URL: "sqlite:///./ci.db"
  CORS_ORIGINS: "http://localhost:5173"
  SEED_SENHA_ADMIN: ci-admin
  SEED_SENHA_RECEPCAO: ci-recepcao
  SEED_SENHA_CARLA: ci-carla
  SEED_SENHA_DIEGO: ci-diego
  SEED_TOTP_ADMIN: JBSWY3DPEHPK3PXP
  LAB_CLIENT_ID: lab-parceiro
  LAB_CLIENT_SECRET: ci-lab-secret

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: pytest (inclui tests/security do threat model)
        run: pytest -v

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit
      - name: Bandit (SAST) — relatório
        run: bandit -r app -f json -o bandit.json || true
      - name: Bandit gate — falha se achado de severidade >= MEDIUM (qualquer confiança)
        # -ll = severidade Medium+. NÃO filtramos por confiança de propósito: nesta
        # versão o Bandit reporta a SQLi (B608) como Medium/confiança-Low; um filtro
        # de confiança deixaria passar a falha mais grave do Assessment (ver docs/12).
        run: bandit -r app -ll
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bandit, path: consultas-api/bandit.json }

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - name: pip-audit (SCA) — relatório
        run: pip-audit -r requirements.txt -f json -o pip-audit.json || true
      - name: pip-audit gate — falha se houver CVE com correção
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pip-audit, path: consultas-api/pip-audit.json }

  dast:
    runs-on: ubuntu-latest
    # DAST é ADVISORY: o security-gate NÃO bloqueia por ele (ver docs/12). Rodamos o
    # ZAP direto via docker (a action zaproxy/action-baseline@v0.12.0 falha no upload
    # por usar a API de artefatos v6.0-preview, descontinuada pelo GitHub). O upload
    # é feito com actions/upload-artifact@v4. continue-on-error mantém o run verde
    # mesmo se o ZAP achar um FAIL (que seria triado a partir do artefato).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Sobe a API em background
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: OWASP ZAP baseline (DAST passivo)
        working-directory: ${{ github.workspace }}
        run: |
          # dir de saída world-writable (o ZAP roda como uid 1000 dentro do container)
          mkdir -p zap-out && cp .zap/rules.tsv zap-out/rules.tsv && chmod -R 777 zap-out
          docker run --rm --network=host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8000/openapi.json \
            -J report_json.json -w report_md.md -r report_html.html \
            -I -c rules.tsv
      - name: Upload relatório ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_scan
          path: zap-out/report_*
          if-no-files-found: warn

  security-gate:
    # DAST é advisory e NÃO entra no needs (ver docs/12): o gate bloqueia só pelos
    # três jobs determinísticos. O ZAP roda em paralelo como job informativo.
    needs: [tests, sast, sca]
    runs-on: ubuntu-latest
    if: always()
    steps:
      # Passo único e determinístico. Os resultados chegam por env (sem interpolação
      # dentro do bash, evita armadilhas de YAML/shell). Aprova só se os TRÊS passarem.
      - name: Consolidar e decidir
        # Este job não faz checkout; o working-directory padrão (consultas-api) não
        # existe aqui. Roda na raiz do workspace, que sempre existe.
        working-directory: ${{ github.workspace }}
        env:
          R_TESTS: ${{ needs.tests.result }}
          R_SAST: ${{ needs.sast.result }}
          R_SCA: ${{ needs.sca.result }}
        run: |
          echo "tests=$R_TESTS sast=$R_SAST sca=$R_SCA"
          if [ "$R_TESTS" = "success" ] && [ "$R_SAST" = "success" ] && [ "$R_SCA" = "success" ]; then
            echo "Security gate aprovado."
          else
            echo "::error::Security gate bloqueou o merge (tests/sast/sca)."
            exit 1
          fi
