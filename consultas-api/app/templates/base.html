<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Recepção{% endblock %} · Clínicas</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <header><h1>{% block heading %}Recepção{% endblock %}</h1></header>
  <main>{% block content %}{% endblock %}</main>
  <footer><small>Uso interno — contém dados de pacientes (LGPD).</small></footer>
</body>
</html>
